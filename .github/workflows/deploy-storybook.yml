name: Deploy Storybook

on:
  push:
    branches:
      - deploy-storybook

jobs:
  deploy-storybook:
    name: Deploy Storybook to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Bun
        uses: oven-sh/setup-bun@v2
        # use package.json - engines.bun for the Bun version
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Init IBM Fonts to Storybook Web
        run: |
          cd ./storybook/expo && bun run init-ibm-fonts-storybook-web
      - name: Deploy
        uses: bitovi/github-actions-storybook-to-github-pages@v1.0.3
        with:
          install_command: bun install --frozen-lockfile
          build_command: bun run packages-builder:carbon-react-native-elements && bun run packages-builder:carbon-react-native && cd ./storybook/expo && bun run storybook-build
          path: ./storybook/expo/.dist
          checkout: false
